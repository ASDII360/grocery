name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project & Add Icon
        run: |
          cordova create myapp com.monthly.rec MonthlyRec
          
          # Copy your specific HTML file into the cordova www folder as index.html
          cp "Grocery APP.html" myapp/www/index.html
          
          # Set up icon resource folders and copy icon
          cd myapp
          cordova platform add android
          mkdir -p resources/android
          if [ -f ../icon.png ]; then
            cp ../icon.png resources/android/icon.png
          fi

      - name: Build Debug APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonthlyRec-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
