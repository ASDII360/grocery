name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project & Configure Icon
        run: |
          cordova create myapp com.monthly.rec MonthlyRec
          cp "Grocery APP.html" myapp/www/index.html
          
          cd myapp
          cordova platform add android
          
          # Place custom app icon into Android drawable resources so it compiles correctly
          if [ -f ../icon.png ]; then
            mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Build Debug APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonthlyRec-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
